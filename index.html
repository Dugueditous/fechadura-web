<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fechadura Web</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #eef2f5; text-align: center; padding: 20px; margin: 0; }
    .card { background: #fff; padding: 25px; border-radius: 15px; max-width: 380px; margin: 30px auto; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
    .tabs { display: flex; margin-bottom: 20px; border-bottom: 2px solid #ddd; }
    .tab { flex: 1; padding: 10px; cursor: pointer; font-weight: bold; color: #666; }
    .tab.active { color: #2196F3; border-bottom: 3px solid #2196F3; }
    .form-group { display: none; }
    .form-group.active { display: block; }
    input { font-size: 18px; padding: 12px; width: 100%; margin-bottom: 15px; border: 2px solid #ddd; border-radius: 8px; outline: none; text-align: center; }
    button { font-size: 18px; padding: 14px; background: #2196F3; color: white; border: none; border-radius: 8px; cursor: pointer; width: 100%; font-weight: bold; }
    .msg { margin-top: 15px; font-weight: bold; min-height: 24px; }
    .sucesso { color: #2e7d32; }
    .erro { color: #c62828; }
  </style>
  
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>
  <div class="card">
    <h2>Fechadura Web</h2>
    <div class="tabs">
      <div class="tab active" onclick="mostrarAba('login')">Entrar</div>
      <div class="tab" onclick="mostrarAba('cadastrar')">Criar Usuário</div>
    </div>

    <div id="aba-login" class="form-group active">
      <input type="text" id="user-login" placeholder="Usuário">
      <input type="password" id="pin-login" maxlength="6" placeholder="PIN (Senha)">
      <button onclick="fazerLogin()">DESTRAVAR</button>
    </div>

    <div id="aba-cadastrar" class="form-group">
      <input type="text" id="user-novo" placeholder="Novo Usuário">
      <input type="password" id="pin-novo" maxlength="6" placeholder="PIN Numérico">
      <button onclick="cadastrarUsuario()">CADASTRAR</button>
    </div>

    <p id="resposta" class="msg"></p>
  </div>

  <script>
    const firebaseConfig = {
      databaseURL: "https://fechadura-91aa4-default-rtdb.firebaseio.com"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let temporizadorMsg;

    function exibirMensagem(texto, tipo) {
      let msg = document.getElementById('resposta');
      msg.className = "msg " + tipo;
      msg.innerHTML = texto;

      // Cancela temporizador anterior se houver e apaga a mensagem após 3 segundos
      clearTimeout(temporizadorMsg);
      temporizadorMsg = setTimeout(() => {
        msg.innerHTML = "";
        msg.className = "msg";
      }, 3000);
    }

    function mostrarAba(aba) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.form-group').forEach(f => f.classList.remove('active'));
      document.getElementById('resposta').innerHTML = "";
      clearTimeout(temporizadorMsg);

      if(aba === 'login') {
        document.querySelectorAll('.tab')[0].classList.add('active');
        document.getElementById('aba-login').classList.add('active');
      } else {
        document.querySelectorAll('.tab')[1].classList.add('active');
        document.getElementById('aba-cadastrar').classList.add('active');
      }
    }

    function fazerLogin() {
      let userInput = document.getElementById('user-login');
      let pinInput = document.getElementById('pin-login');
      let user = userInput.value.trim();
      let pin = pinInput.value.trim();

      if (!user || !pin) {
        exibirMensagem("Preencha tudo!", "erro");
        return;
      }

      // Limpa os campos imediatamente após o clique
      userInput.value = "";
      pinInput.value = "";

      db.ref('usuarios/' + user).once('value')
        .then(snapshot => {
          if (snapshot.exists() && snapshot.val().pin === pin) {
            exibirMensagem("🔓 Comando enviado ao ESP32!", "sucesso");
            db.ref('comando').set({ acao: "ABRIR", usuario: user, timestamp: Date.now() });
          } else {
            exibirMensagem("❌ Usuário ou PIN incorreto!", "erro");
            db.ref('comando').set({ acao: "NEGADO", usuario: user, timestamp: Date.now() });
          }
        })
        .catch(err => {
          exibirMensagem("Erro: " + err.message, "erro");
        });
    }

    function cadastrarUsuario() {
      let userInput = document.getElementById('user-novo');
      let pinInput = document.getElementById('pin-novo');
      let user = userInput.value.trim();
      let pin = pinInput.value.trim();

      if (!user || !pin) {
        exibirMensagem("Preencha tudo!", "erro");
        return;
      }

      document.getElementById('resposta').className = "msg";
      document.getElementById('resposta').innerHTML = "Salvando...";

      db.ref('usuarios/' + user).set({ pin: pin })
        .then(() => {
          exibirMensagem("✅ Usuário salvo!", "sucesso");
          userInput.value = "";
          pinInput.value = "";
        })
        .catch(err => {
          exibirMensagem("❌ Erro ao salvar: " + err.message, "erro");
        });
    }
  </script>
</body>
</html>
